<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Goodreads</title>
  </head>
  <body>
    <header>
      <h1>GoodReads</h1>
    </header>
    <main>
      <form id="form">
        <input
          type="text"
          required
          placeholder="Bok titel"
          id="titleInput"
          class="bookInput"
        />
        <input
          type="text"
          required
          placeholder="Författare"
          id="authorInput"
          class="bookInput"
        />
        <div class="checkboxContainer">
          <input type="checkbox" id="readBox" class="checkboxContainer" />
          <label for="readBox" class="checkboxContainer"
            >Jag har läst boken</label
          >
        </div>

        <button type="submit" id="addButton" class="buttonPrimary">
          Lägg till
        </button>
      </form>

      <h2>TBR-lista</h2>
      <ul id="tbrList" class="bookList"></ul>

      <h2>Mina lästa böcker</h2>
      <ul id="myBooksList" class="bookList"></ul>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
